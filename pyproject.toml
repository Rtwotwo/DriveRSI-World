[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driversi-world"
version = "0.1.0"
description = "Driving scene synthesis, WorldEngine execution and evidence qualification"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
nuplan = ["nuplan-devkit==1.2.0"]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[project.scripts]
driversi-world = "driversi_world.cli:main"

[tool.setuptools]
package-dir = {driversi_world = "src"}
include-package-data = false

[tool.setuptools.package-data]
"driversi_world" = ["resources/navsim/*.yaml", "resources/navsim/LICENSE", "resources/navsim/provenance.json"]
"driversi_world.simulation" = ["LICENSE", "provenance.json", "configs/**/*.yaml", "configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
